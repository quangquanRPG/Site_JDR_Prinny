<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fiche personnage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<!-- VERSION (?v=…) : la même que dans ../../index.html, à changer partout à chaque mise à jour. -->
<link rel="stylesheet" href="css/base.css?v=0.3.2">
<link rel="stylesheet" href="css/composants.css?v=0.3.2">
<link rel="stylesheet" href="css/ressources.css?v=0.3.2">
<link rel="stylesheet" href="css/degats.css?v=0.3.2">
<link rel="stylesheet" href="css/mana.css?v=0.3.2">
<link rel="stylesheet" href="css/blessures.css?v=0.3.2">
<link rel="stylesheet" href="css/armures.css?v=0.3.2">
<link rel="stylesheet" href="css/armes.css?v=0.3.2">
<link rel="stylesheet" href="css/bourse.css?v=0.3.2">
<link rel="stylesheet" href="css/inventaire.css?v=0.3.2">
<link rel="stylesheet" href="css/competences.css?v=0.3.2">
<link rel="stylesheet" href="css/dons.css?v=0.3.2">
<link rel="stylesheet" href="css/mj.css?v=0.3.2">
<link rel="stylesheet" href="css/reussite.css?v=0.3.2">
</head>
<body>
<main class="fiche">
  <h1 id="nom-perso"></h1>
  <div class="sous-titre">Tous les jets en d6 — chaque valeur = nombre de dés à lancer</div>

  <div class="demo-role">
    Démo — je regarde la fiche en tant que :
    <select id="choix-role">
      <option value="mj">MJ</option>
      <option value="proprio" selected>Joueur propriétaire de la fiche</option>
      <option value="autre">Autre joueur</option>
    </select>
  </div>

  <h2>État</h2>
  <section class="ressources" id="ressources-etat"></section>
  <div class="actions-etat">
    <div id="zone-degats"></div>
    <div id="zone-mana"></div>
  </div>
  <div id="blessures"></div>

  <h2>Défense</h2>
  <section class="ressources deux" id="ressources-defense"></section>
  <div class="sous-label"><span>Sets d'armure</span><span id="retirer-armure"></span></div>
  <section class="armures" id="armures"></section>

  <h2>Armes</h2>
  <div class="sous-label sous-label--haut"><span>Portées</span><span id="compteur-armes"></span></div>
  <section class="slots" id="armes-portees"></section>
  <div class="sous-label"><span>Autres armes</span></div>
  <section class="inventaire" id="armes-inventaire"></section>

  <h2>Bourse</h2>
  <section class="bourse" id="bourse"></section>

  <div id="zone-inventaire"></div>
  <div id="zone-inventaireNonImportant"></div>

  <h2>Compétences</h2>
  <section class="competences" id="competences"></section>

  <h2>Dons &amp; connaissances</h2>
  <section class="dons" id="dons"></section>
  <div id="zone-mj"></div>

  <div id="reglages-mj"></div>
</main>

<aside class="panneau-reussite" id="reussite" aria-label="Seuil de réussite"></aside>

<!-- Outils -->
<script src="js/outils.js?v=0.3.2"></script>
<!-- Règles du jeu : données et calculs (aucun affichage) -->
<script src="js/regles/competences.js?v=0.3.2"></script>
<script src="js/regles/ressources.js?v=0.3.2"></script>
<script src="js/regles/armures.js?v=0.3.2"></script>
<script src="js/regles/armes.js?v=0.3.2"></script>
<script src="js/regles/bourse.js?v=0.3.2"></script>
<script src="js/regles/inventaires.js?v=0.3.2"></script>
<script src="js/regles/blessures.js?v=0.3.2"></script>
<script src="js/regles/efforts.js?v=0.3.2"></script>
<script src="js/regles/fatigue.js?v=0.3.2"></script>
<script src="js/regles/mana.js?v=0.3.2"></script>
<script src="js/regles/reussite.js?v=0.3.2"></script>
<script src="js/regles/dons.js?v=0.3.2"></script>
<script src="js/regles/des.js?v=0.3.2"></script>
<script src="js/regles/droits.js?v=0.3.2"></script>
<script src="js/regles/fiche.js?v=0.3.2"></script>
<!-- Actions : modifient la fiche en vérifiant les droits -->
<script src="js/actions/etat.js?v=0.3.2"></script>
<script src="js/actions/degats.js?v=0.3.2"></script>
<script src="js/actions/mana.js?v=0.3.2"></script>
<script src="js/actions/equipement.js?v=0.3.2"></script>
<script src="js/actions/bourse.js?v=0.3.2"></script>
<script src="js/actions/inventaire.js?v=0.3.2"></script>
<script src="js/actions/dons.js?v=0.3.2"></script>
<!-- Affichage : un fichier par bloc de la fiche -->
<script src="js/affichage/ressources.js?v=0.3.2"></script>
<script src="js/affichage/usure.js?v=0.3.2"></script>
<script src="js/affichage/efforts.js?v=0.3.2"></script>
<script src="js/affichage/reussite.js?v=0.3.2"></script>

<script src="js/integration/donnees-rp.js?v=0.3.2"></script>

<script src="js/demo.js?v=0.3.2"></script>

</body>
</html>
